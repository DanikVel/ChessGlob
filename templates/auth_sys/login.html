{% extends "base.html" %}

{% block title %}
<title>Вхід в аккаунт</title>
{% endblock %}

{% block body %}
<h1>Вхід до акаунту</h1>

{% if messages %}
<ul>
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}

<form method="POST">
    {% csrf_token %}
    
    <p>Введіть ваш юзернейм: <input type="text" name="username" maxlength="16" required></p>
    <p>Введіть ваш пароль: <input type="password" name="password" required></p>

    <input type="submit" value="Увійти до акаунту">
</form>
{% endblock %}
